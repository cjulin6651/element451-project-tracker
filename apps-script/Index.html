<style>
:root{
  --bg:#1b2025;--panel:#232a30;--raised:#2a3239;--raised2:#313b44;--rule:#3b4650;--soft:#303941;
  --ink:#f0f2f3;--slate:#bcc5cb;--mist:#89959e;--accent:#7fc4e7;--accent-bg:#1d3947;
  --danger:#e7a09b;--danger-bg:#3a292b;--grow:#acd88a;--grow-bg:#293b24;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'IBM Plex Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:20px 24px 80px}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--raised);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus,.mention-editor:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(127,196,231,.08)}
select option{background:var(--raised)}

.topnav{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.home{font-family:var(--serif);font-weight:600;font-size:19px;white-space:nowrap;display:inline-flex;align-items:center}.home:hover{color:var(--accent)}

.navlinks{display:flex;align-items:center;gap:3px;min-width:0}
.navlink{font-size:13px;color:var(--slate);padding:7px 9px;border-radius:5px;white-space:nowrap}
.navlink:hover{background:var(--raised);color:var(--ink)}.navlink.on{background:var(--accent-bg);color:var(--accent)}
.navlink .n{font-family:var(--mono);font-size:10px;color:var(--mist);margin-left:4px}.navlink.on .n{color:var(--accent)}
.navactions{display:flex;align-items:center;gap:8px;margin-left:auto}.who{font-family:var(--mono);font-size:10.5px;color:var(--mist);margin-left:4px;white-space:nowrap}
.noticebtn,.iconbtn{border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:12.5px;color:var(--slate);position:relative}.noticebtn:hover,.iconbtn:hover{border-color:var(--mist);color:var(--ink)}
.badge{position:absolute;top:-7px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:10px;background:var(--danger);color:#261719;font:bold 10px/18px var(--mono);text-align:center}

.pagehead{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}.pagehead h1{font:600 25px/1.2 var(--serif);margin:0}.pagecount{color:var(--mist);font-size:12px}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input.search{flex:1;min-width:220px}.bar select{min-width:150px}.filterrow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}

function attachmentsForActivity(activityId){

  // rows so old note tags can still render. A duplicate attachment relationship
  // can therefore exist once in active resources and once in resourceTokens.
  // Deduplicate by the underlying file (Drive ID first, then activity/name/MIME),
  // not by resource_id. Active resources are visited first and win.
  const rows=(state.resources||[]).concat(state.resourceTokens||[]),seen=new Set(),out=[];
  rows.forEach(r=>{
    if(!r||r.activity_id!==activityId||r.resource_type!=='attachment'||!r.visible_in_card)return;
    const drive=String(r.drive_file_id||'').trim();
    const key=drive?'drive:'+drive:'activity:'+String(activityId||'')+'|name:'+String(r.name||'').trim().toLowerCase()+'|mime:'+String(r.mime_type||'').trim().toLowerCase();
    if(seen.has(key))return;
    seen.add(key);
    out.push(r);
  });
  return out;
}

function editorMarkup(node){
  if(!node)return'';

    if(n.nodeType===Node.TEXT_NODE)return n.nodeValue||'';
    if(n.nodeType!==Node.ELEMENT_NODE)return'';
    const e=n;
    if(e.matches&&e.matches('[data-browser-quote]'))return '[quote:'+encodeURIComponent(e.innerText||'')+']';
    if(e.matches&&e.matches('[data-source-url]'))return '[src:'+encodeURIComponent(e.dataset.sourceUrl||'')+'|'+encodeURIComponent(e.dataset.sourceTitle||'')+']';
    if(e.matches&&e.matches('[data-student-token]')){
      const id=e.dataset.studentToken,stu=studentById(id),expected='#'+(stu?(stu.name||[stu.first_name,stu.last_name].filter(Boolean).join(' ')):'Student'),visible=String(e.textContent||'');

    }
    if(e.matches&&e.matches('[data-resource-token]')){
      const id=e.dataset.resourceToken,r=resourceById(id),expected=r?resourceSymbol(r)+(r.name||r.external_id||'Resource'):'',visible=String(e.textContent||'');
      const suffix=expected&&visible.startsWith(expected)?visible.slice(expected.length):'';
      return '[res:'+id+']'+suffix;
    }
    if(e.tagName==='IMG'&&e.dataset.inlineResource)return '[img:'+e.dataset.inlineResource+']';
    if(e.tagName==='IMG'&&e.dataset.inlineTemp)return '[imgtmp:'+e.dataset.inlineTemp+']';
    if(e.tagName==='BR')return '\n';
    const inner=Array.from(e.childNodes).map(walk).join('');
    if(e.tagName==='STRONG'||e.tagName==='B')return '[b]'+inner+'[/b]';
    if(e.tagName==='EM'||e.tagName==='I')return '[i]'+inner+'[/i]';
    if(e.tagName==='U')return '[u]'+inner+'[/u]';
    if(e.tagName==='DIV'||e.tagName==='P')return inner+(e===node?'':'\n');
    return inner;
  }
  return Array.from(node.childNodes).map(walk).join('').replace(/\n{3,}/g,'\n\n').trim();
}

async function hydrateInlineImages(root=document){

  // Reuse that request instead of launching a duplicate batch for the same
  // ticket, then hydrate whatever DOM survived the render from the shared cache.

    if(inlineImageInFlight===request){inlineImageInFlight=null;inlineImageTicket='';}

}

function relatedSyncStamp_(ticket){return [String(ticket&&ticket.updated_at||''),String(ticket&&ticket.last_activity_at||'')].join('|');}
function scheduleTicketBackground_(ticketId){
  setTimeout(async()=>{
    if(!state.ticket||state.ticket.ticket_id!==ticketId||state.ticketHydrating)return;
    await refreshRelatedInBackground(ticketId);
    if(!state.ticket||state.ticket.ticket_id!==ticketId||state.ticketHydrating)return;
    startPresence(ticketId);
    pollNotifications(false);
  },250);
}
async function refreshRelatedInBackground(ticketId){
  if(BOOT&&BOOT.role==='viewer')return;
  if(!state.ticket||state.ticket.ticket_id!==ticketId)return;
  const stamp=relatedSyncStamp_(state.ticket),memo=relatedSyncMemo[ticketId];
  if(memo&&memo.stamp===stamp&&Date.now()-memo.at<120000)return;

  // Let the visible ticket finish its image hydration before starting the
  // heavier relationship/Chat repair pass. This prevents two Apps Script/Drive
  // background jobs from competing immediately after the ticket appears.
  if(inlineImageInFlight&&inlineImageTicket===ticketId){
    try{await inlineImageInFlight;}catch(ignore){}
  }
  if(!state.ticket||state.ticket.ticket_id!==ticketId)return;
  try{
    const before=JSON.stringify([state.students,state.studentTokens,state.resources,state.resourceTokens,state.activity]);
    const out=await call('api_syncRelated',ticketId);
    if(!state.ticket||state.ticket.ticket_id!==ticketId)return;
    state.students=out.students||state.students;
    state.studentTokens=out.studentTokens||state.studentTokens;
    state.resources=out.resources||state.resources;
    state.resourceTokens=out.resourceTokens||state.resourceTokens;
    if(out.activity)state.activity=out.activity;
    relatedSyncMemo[ticketId]={stamp:relatedSyncStamp_(state.ticket),at:Date.now()};
    const after=JSON.stringify([state.students,state.studentTokens,state.resources,state.resourceTokens,state.activity]);
    // Avoid tearing down/rebuilding the whole detail DOM when the background
    // maintenance pass was a true no-op. Any actual data change still renders.
    if(out.changed||before!==after)render();
  }catch(e){console.warn('Related data refresh failed',e);}
}

    const meta={from:'',to:'',cc:'',date:'',body:''};

      let match;
      if((match=line.match(/^From:\s*(.*)$/i))){meta.from=match[1].trim();seen=true;continue;}
      if((match=line.match(/^To:\s*(.*)$/i))){meta.to=match[1].trim();seen=true;continue;}
      if((match=line.match(/^Cc:\s*(.*)$/i))){meta.cc=match[1].trim();seen=true;continue;}

}

function notificationActionText(n){
  if(n.kind==='priority')return `${firstName(n.actor)} marked high priority · ${n.title}`;
  if(n.kind==='assignment')return `${firstName(n.actor)} assigned you · ${n.title}`;
  if(n.kind==='watch_note')return `${firstName(n.actor)} added a note · ${n.title}`;
  if(n.kind==='watch_progress')return `${firstName(n.actor)} changed progress · ${n.title}`;

function mergeOwnerText(value){
  const owners=String(value||'').split(',').filter(Boolean);
  return owners.length?owners.map(displayName).join(', '):'\u2014';
}
function mergeProgressHtml(t){
  const filled=Math.max(0,Math.min(10,Number(t.progress)||0));
  return `<div class="mergeprogress">${RAMP.map((c,i)=>i<filled?`<i class="f" style="background:${c}"></i>`:'<i></i>').join('')}</div>`;
}
function mergeStatusHtml(t){
  return `<div>${esc(statusLabel(t))}<span class="sub">${filledLabel(t.progress)}</span>${mergeProgressHtml(t)}</div>`;
}
function filledLabel(n){
  n=Math.max(0,Math.min(10,Number(n)||0));
  return n+' of 10';
}
function mergeValueHtml(field,t){
  if(field==='owners')return esc(mergeOwnerText(t.owners));
  if(field==='status_bundle')return mergeStatusHtml(t);
  let value=t[field];
  if(field==='due_date'&&value)value=String(value).substring(0,10);
  if(field==='description')value=String(value||'').trim();
  return esc(value||'\u2014');
}
function mergeChoiceButtons(field,choice,opts){

  const custom=opts.custom?`<button class="mergechoice custom ${choice==='custom'?'on':''}" data-merge-choice="${field}" data-choice="custom" title="Set a new value">Set new</button>`:both;
  return `<div class="mergecontrol"><button class="mergechoice ${choice==='primary'?'on':''}" data-merge-choice="${field}" data-choice="primary" title="Use primary value">\u2190</button>${custom}<button class="mergechoice ${choice==='secondary'?'on':''}" data-merge-choice="${field}" data-choice="secondary" title="Use other value">\u2192</button></div>`;

    function draw(){
      const x=pair(),p=x.primary,s=x.secondary;
      const pNotes=x.primaryActivity.filter(a=>a.kind==='note').length;
      const sNotes=x.secondaryActivity.filter(a=>a.kind==='note').length;
      const customHtml=choices.status_bundle==='custom'?mergeCustomStatusHtml(customStatus):'';
      body.innerHTML=`<h3>Merge tickets</h3><div class="mergeprimary"><button class="primarychoice ${primaryId===current.ticket.ticket_id?'on':''}" data-primary="${esc(current.ticket.ticket_id)}"><b>${esc(current.ticket.title)}</b><small>${esc(current.ticket.ticket_id)} \u00b7 make this the primary ticket</small></button><button class="primarychoice ${primaryId===other.ticket.ticket_id?'on':''}" data-primary="${esc(other.ticket.ticket_id)}"><b>${esc(other.ticket.title)}</b><small>${esc(other.ticket.ticket_id)} \u00b7 make this the primary ticket</small></button></div><div class="mergeboard">${mergeRowHtml('Title','title',p,s,choices.title)}${mergeRowHtml('Project Details','description',p,s,choices.description,{detailsAsNote})}${mergeRowHtml('Owner','owners',p,s,choices.owners)}${mergeRowHtml('Type','type',p,s,choices.type)}${mergeRowHtml('Department','department',p,s,choices.department)}${mergeRowHtml('Size','size',p,s,choices.size)}${mergeRowHtml('Due date','due_date',p,s,choices.due_date)}${mergeRowHtml('Status / progress','status_bundle',p,s,choices.status_bundle,{customHtml})}${mergeRowHtml('Notes','notes',p,s,choices.notes,{primaryNotes:pNotes,secondaryNotes:sNotes})}</div><label class="checkline"><input type="checkbox" id="merge-trash" checked><span>Move <strong>${esc(s.title)}</strong> <span style="font:10px var(--mono);color:var(--mist)">${esc(s.ticket_id)}</span> to Trash after the merge. Its original record stays restorable during the restore window.</span></label><div class="hint">Non-note activity and linked tickets from the other ticket are preserved automatically.</div><div class="acts"><button class="go" id="merge-run">Merge tickets</button><button class="cx" id="merge-back">Back</button><button class="cx" id="merge-cancel">Cancel</button></div>`;

      body.querySelectorAll('[data-primary]').forEach(b=>b.onclick=()=>{
        if(primaryId===b.dataset.primary)return;
        primaryId=b.dataset.primary;
        resetChoices();
        draw();
      });
      body.querySelectorAll('[data-merge-choice]').forEach(b=>b.onclick=()=>{
        choices[b.dataset.mergeChoice]=b.dataset.choice;
        draw();
      });
      const detailsCheck=body.querySelector('#merge-details-note');
      if(detailsCheck)detailsCheck.onchange=()=>{detailsAsNote=detailsCheck.checked;};
      const customSelect=body.querySelector('#merge-custom-status');
      if(customSelect)customSelect.onchange=()=>{
        const parts=customSelect.value.split('|');
        customStatus.status=parts[0];
        customStatus.substatus=parts[1]||'';
        if(customStatus.status==='completed')customStatus.progress=10;
        else if(customStatus.progress===10)customStatus.progress=9;
        draw();
      };
      body.querySelectorAll('[data-custom-progress]').forEach(b=>b.onclick=()=>{
        const n=Number(b.dataset.customProgress);
        customStatus.progress=n;
        if(n===10){customStatus.status='completed';customStatus.substatus='done';}
        else if(customStatus.status==='completed'){customStatus.status='in_progress';customStatus.substatus='';}
        draw();
      });
      body.querySelector('#merge-back').onclick=searchStep;
      body.querySelector('#merge-cancel').onclick=()=>overlay.remove();
      body.querySelector('#merge-run').onclick=async()=>{
        const btn=body.querySelector('#merge-run');
        btn.disabled=true;btn.textContent='Merging\u2026';
        const selections=Object.assign({},choices,{
          details_to_note:detailsAsNote,
          status_custom:customStatus
        });
        try{
          const out=await call('api_merge',p.ticket_id,s.ticket_id,selections,body.querySelector('#merge-trash').checked);
          state.ticket=out.ticket;state.activity=out.activity||[];state.links=out.links||[];state.students=out.students||[];state.resources=out.resources||[];state.counts=out.counts||state.counts;
          routeTicket(state.ticket.ticket_id,'replace');
          overlay.remove();toast('Tickets merged');render();startPresence(state.ticket.ticket_id);
        }catch(e){toast(e.message||e);btn.disabled=false;btn.textContent='Merge tickets';}
      };
    }
    draw();
  }
  searchStep();
}

boot();
</script>
</body>
</html>
